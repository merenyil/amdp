# Measurement site definitions, used by measurement_sites.py / measurement_site_list.
# lat/long: degrees. elev: meters. I_deg/D_deg: typical inclination/declination (degrees).
# F: typical total field (nT). pillars: list of known pillar names at the site.
# H: optional, typical horizontal field component (nT) - only given where known.
#
# refpos: known reference-mark azimuth directions at the site (degrees), used as
# measurement_sites.refpos_const_data_list. Each entry is [refmark-name, azimuth_deg].
# Order matters: the first entry is used as the site's default pillar/refmark name
# (see measurement_sites.get_default_pillar_name()).

MNY:
